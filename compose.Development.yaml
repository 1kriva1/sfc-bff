name: sfc-bff
include:
   - compose.Infrastructure.yaml
x-build-args: &build_args
  args:
    BUILD_CONFIGURATION: Debug
x-use-authentication-volume: &use_authentication_volume
  UseAuthentication: true
services:
  sfc-bff:
    extends:
      file: compose.Common.yaml
      service: sfc-bff
    image: kryvorukandrii/sfc.bff:development
    build:
      dockerfile: src/Backend/SFC.Backend/Dockerfile.Development
      <<: *build_args
    ports:
      - "4200:4200"
    env_file:
      - environments/api/api.Development.env
    healthcheck:
      start_period: 340s
    volumes:
      - type: bind
        source: .
        target: /app
  sfc-data:
    extends:
      file: compose.Common.yaml
      service: sfc-data
    image: kryvorukandrii/sfc.data:development
    build:
      dockerfile: ../../Services/sfc-data-service/src/API/SFC.Data.Api/Dockerfile.Development
      <<: *build_args
    env_file:
      - ../../Services/sfc-data-service/environments/api/api.Development.env    
    environment:
      *use_authentication_volume
    healthcheck:
      start_period: 660s
    volumes:
      -  type: bind
         source: ../../Services/sfc-data-service
         target: /app
  sfc-identity:
    extends:
      file: compose.Common.yaml
      service: sfc-identity
    image: kryvorukandrii/sfc.identity:development
    build:
      dockerfile: ../../Services/sfc-identity-service/src/API/SFC.Identity.Api/Dockerfile.Development
      <<: *build_args
    env_file:
      - ../../Services/sfc-identity-service/environments/api/api.Development.env
    environment:
      *use_authentication_volume
    healthcheck:
        start_period: 600s
    volumes:
      - type: bind
        source: ../../Services/sfc-identity-service
        target: /app
      - type: volume
        target: /app/src/Client/SFC.Identity.Client/node_modules
  sfc-player:
    extends:
      file: compose.Common.yaml
      service: sfc-player
    image: kryvorukandrii/sfc.player:development
    build:
      dockerfile: ../../Services/sfc-player-service/src/API/SFC.Player.Api/Dockerfile.Development
      <<: *build_args
    env_file:
      - ../../Services/sfc-player-service/environments/api/api.Development.env    
    environment:
      *use_authentication_volume
    healthcheck:
      start_period: 660s
    volumes:
      -  type: bind
         source: ../../Services/sfc-player-service
         target: /app
  sfc-team:
    extends:
      file: compose.Common.yaml
      service: sfc-team
    image: kryvorukandrii/sfc.team:development
    build:
      dockerfile: ../../Services/sfc-team-service/src/API/SFC.Team.Api/Dockerfile.Development
