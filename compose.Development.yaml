    env_file:
      - ../../Services/sfc-team-service/environments/api/api.Development.env    
    environment:
      *use_authentication_volume
    healthcheck:
      start_period: 660s
    volumes:
      -  type: bind
         source: ../../Services/sfc-team-service
         target: /app
  sfc-invite:
    extends:
      file: compose.Common.yaml
      service: sfc-invite
    image: kryvorukandrii/sfc.invite:development
