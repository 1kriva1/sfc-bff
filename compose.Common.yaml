name: sfc-bff
include:
   - compose.Infrastructure.yaml
x-root-certificate-volume: &root-certificate-volume
  type: bind
  source: ../../Configurations/certificates/root/sfcRootCA.crt
  target: /usr/local/share/ca-certificates/sfcRootCA.crt
x-common-deploy: &common_deploy
  deploy:
    replicas: 1
    restart_policy:
      condition: on-failure
      delay: 5s
      max_attempts: 3
      window: 120s
services:
  sfc-bff:
    container_name: sfc-bff
    build:
      context: .
      args:
        HTTP_PORT: 7165
        HTTPS_PORT: 7166
    ports:
      - "7166:7166"
      - "7165:7165"
    healthcheck:
          test: ["CMD", "curl", "--fail", "http://localhost:7165/health"] 
          interval: 20s
          timeout: 10s
          retries: 3
          start_period: 60s
    volumes:
      - *root-certificate-volume
      - type: bind
        source: ../../Configurations/certificates/sfc-bff/sfc-bff.pfx
        target: /https/sfc-bff.pfx
    networks: 
      - sfc-network
    <<: *common_deploy
    depends_on:
      sfc-mssql:
        condition: service_healthy
        restart: true
      sfc-redis:
        condition: service_healthy
        restart: true
      sfc-rabbitmq:
        condition: service_healthy
        restart: true
      sfc-data:
        condition: service_healthy
        restart: true
      sfc-identity:
        condition: service_healthy
        restart: true
      sfc-player:
        condition: service_healthy
        restart: true
      sfc-team:
        condition: service_healthy
        restart: true
      sfc-invite:
        condition: service_healthy
        restart: true
      sfc-request:
        condition: service_healthy
        restart: true
      sfc-scheme:
        condition: service_healthy
        restart: true
      sfc-game:
        condition: service_healthy
        restart: true
  sfc-data:
