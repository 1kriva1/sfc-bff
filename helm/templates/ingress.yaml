apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sfc-bff-ingress
  namespace: sfc
  labels:
    app.kubernetes.io/name: sfc-bff
    app.kubernetes.io/component: network
    app.kubernetes.io/part-of: sfc
    app.kubernetes.io/instance: production
    app.kubernetes.io/managed-by: kubectl
  annotations:
    owner: "krivorukandrey@gmail.com"
    purpose: "Ingress for Bff component in SFC application"
    # Client → Ingress redirect to HTTPS
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # Ingress → backend uses HTTPS
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    # Verify backend's cert using your Root CA
    nginx.ingress.kubernetes.io/proxy-ssl-verify: "on"
    nginx.ingress.kubernetes.io/proxy-ssl-secret: "sfc/sfc-bff-ingress-secret"
    nginx.ingress.kubernetes.io/proxy-ssl-server-name: "on"
    # This must match a SAN on your backend cert (NOT the service DNS unless included)
    nginx.ingress.kubernetes.io/proxy-ssl-name: "sfc-bff"    
    # FIX: Allow large OIDC cookies/headers
    nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "8"
    nginx.ingress.kubernetes.io/proxy-busy-buffers-size: "256k"
    # Optional but recommended
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - sfc-bff
      secretName: sfc-bff-ingress-tls-secret
  rules:
    - host: sfc-bff
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sfc-bff
                port:
                  number: 7166