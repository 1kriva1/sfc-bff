apiVersion: v1
kind: ResourceQuota
metadata:
  name: sfc-resource-quota
  namespace: sfc
  labels:
    app.kubernetes.io/name: sfc
    app.kubernetes.io/component: quota
    app.kubernetes.io/part-of: sfc
    app.kubernetes.io/instance: production
    app.kubernetes.io/managed-by: kubectl
  annotations:
    owner: "krivorukandrey@gmail.com"
    purpose: "Prevent any single team from exhausting the cluster for SFC workloads"
spec:
  hard:
    # Compute & memory
    requests.cpu: "16"
    requests.memory: 32Gi
    limits.cpu: "32"
    limits.memory: 32Gi
    requests.ephemeral-storage: "20Gi"
    limits.ephemeral-storage: "40Gi"
    # Object counts
    pods: "100"
    configmaps: "100"
    secrets: "200"
    persistentvolumeclaims: "20"
    services: "40"
    services.loadbalancers: "3"
    services.nodeports: "3"
    # Limit higher-cost controller types
    count/jobs.batch: "50"
    count/cronjobs.batch: "20"