apiVersion: v1
kind: LimitRange
metadata:
  name: sfc-limit-range
  namespace: sfc
  labels:
    app.kubernetes.io/name: sfc
    app.kubernetes.io/component: policy
    app.kubernetes.io/part-of: sfc
    app.kubernetes.io/instance: production
    app.kubernetes.io/managed-by: kubectl
  annotations:
    owner: "krivorukandrey@gmail.com"
    purpose: "Enforce conservative, production-safe resource defaults and limits for SFC workloads"
spec:
  limits:
    - type: Container
  
      # Reasonable default requests so pods don't start with 0/0
      defaultRequest:
        cpu: "200m"
        memory: "512Mi"
        ephemeral-storage: "512Mi"

      # Default limits that fit typical app pods and RabbitMQ
      default:
        cpu: "1"
        memory: "1Gi"
        ephemeral-storage: "1Gi"

      # Lower, permissive mins so small services can schedule
      min:
        cpu: "50m"
        memory: "64Mi"
        ephemeral-storage: "256Mi"

      # Namespace caps aligned to previous guidance:
      # - Redis up to ~512Mi
      # - RabbitMQ up to 1Gi
      # - MSSQL up to 4Gi (and 2 CPUs) for local/dev
      max:
        cpu: "2"
        memory: "4Gi"
        ephemeral-storage: "5Gi"

      # Optional: keep ratios sane (avoid 50m request with 2 CPU limit)
      maxLimitRequestRatio:
        cpu: "10"              # e.g., 200m req -> up to 2 CPU limit
        memory: "8"            # e.g., 512Mi req -> up to 4Gi limit
        ephemeral-storage: "10"
