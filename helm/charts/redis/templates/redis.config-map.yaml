apiVersion: v1
kind: ConfigMap
metadata:
  name: sfc-redis-config-map
  namespace: sfc  
  labels:
    app.kubernetes.io/name: sfc-redis
    app.kubernetes.io/component: configuration
    app.kubernetes.io/part-of: sfc
    app.kubernetes.io/instance: production
    app.kubernetes.io/managed-by: kubectl
  annotations:
    owner: "krivorukandrey@gmail.com"
    purpose: "Configuration map for Redis component in SFC application"
immutable: true
data:  
  redis.conf: |
    port 6379
    dir /data
    loglevel debug
    # AOF persistence
    appendonly yes
    appendfsync everysec
    # RDB snapshots
    save 900 1
    save 300 10
    save 60 10000