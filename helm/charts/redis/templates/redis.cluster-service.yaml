apiVersion: v1
kind: Service
metadata:
  name: sfc-redis
  namespace: sfc
  labels:
    app.kubernetes.io/name: sfc-redis
    app.kubernetes.io/component: network
    app.kubernetes.io/part-of: sfc
    app.kubernetes.io/instance: production
    app.kubernetes.io/managed-by: kubectl
  annotations:
    owner: "krivorukandrey@gmail.com"
    purpose: "Internal ClusterIP service for Redis component in SFC application"
spec:
  selector:
    app.kubernetes.io/name: sfc-redis
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: sfc-redis-cluster-service-port
      protocol: TCP
      port: 6379
      targetPort: 6379
  internalTrafficPolicy: Cluster