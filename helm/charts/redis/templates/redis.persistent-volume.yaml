apiVersion: v1
kind: PersistentVolume
metadata:
  name: sfc-redis-persistent-volume
  labels:
    app.kubernetes.io/name: sfc-redis
    app.kubernetes.io/component: storage
    app.kubernetes.io/part-of: sfc
    app.kubernetes.io/instance: production
    app.kubernetes.io/managed-by: kubectl
  annotations:
    owner: "krivorukandrey@gmail.com"
    purpose: "Persistent volume for Redis component in SFC application"
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: sfc-redis-storage-class
  hostPath: #it's not recommended for production, but it's simple for demo purposes. In production, consider using a cloud provider's storage solution or a networked storage system.'
    path: "/mnt/data/redis"
    type: DirectoryOrCreate  
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
          - key: kubernetes.io/hostname
            operator: In
            values: ["desktop-worker"]