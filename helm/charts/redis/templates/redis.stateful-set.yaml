apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sfc-redis-stateful-set
  namespace: sfc
  labels:
    app.kubernetes.io/name: sfc-redis
    app.kubernetes.io/component: infrastructure
    app.kubernetes.io/part-of: sfc
    app.kubernetes.io/instance: production
    app.kubernetes.io/version: "8.4.0"
    app.kubernetes.io/managed-by: kubectl
  annotations:
    owner: "krivorukandrey@gmail.com"
    purpose: "Stateful Set for Redis component in SFC application"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: sfc-redis
  replicas: {{ .Values.replicas }}
  serviceName: sfc-redis
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sfc-redis
        app.kubernetes.io/component: infrastructure
        app.kubernetes.io/part-of: sfc
        app.kubernetes.io/instance: production
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      containers:
        - name: sfc-redis
          image: docker.io/redis:8.4.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: sfc-redis-port
              protocol: TCP
              containerPort: 6379
          command: ["sh", "-c"]
          args:
            - >              
              exec redis-server /usr/local/etc/redis/redis.conf
              --aclfile /usr/local/etc/redis/users.acl          
          env:
            - name: REDIS_USERNAME
              valueFrom:
                secretKeyRef:
                  name: sfc-redis-secret
                  key: username
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sfc-redis-secret
                  key: password
          volumeMounts:
            - name: sfc-redis-volume
              mountPath: /data            
            - name: sfc-redis-config
              mountPath: /usr/local/etc/redis/redis.conf
              subPath: redis.conf            
            - name: sfc-redis-secret
              mountPath: /usr/local/etc/redis/users.acl
              subPath: users.acl
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - |
                  redis-cli -h 127.0.0.1 -p 6379 --user "$REDIS_USERNAME" --pass "$REDIS_PASSWORD" PING | grep -q PONG
            initialDelaySeconds: 0 # Time (in seconds) to wait before running the first probe. Useful for applications that need some warm-up time.
            periodSeconds: 5 #How often to run the probe.
            timeoutSeconds: 2 #Time allowed for a probe to complete.
            successThreshold: 1 #How many successes in a row are needed for the probe to be considered successful again.
            failureThreshold: 30 #Number of consecutive failures before Kubernetes marks container as:Unhealthy (liveness → restart) Not ready (readiness) Not yet started (startup)            
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - |
                  redis-cli -h 127.0.0.1 -p 6379 --user "$REDIS_USERNAME" --pass "$REDIS_PASSWORD" PING | grep -q PONG
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 3          
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"      
      volumes:
        - name: sfc-redis-config
          configMap:
            name: sfc-redis-config-map        
        - name: sfc-redis-secret
          secret:
            secretName: sfc-redis-secret
  volumeClaimTemplates:
    - metadata:
        name: sfc-redis-volume
        labels:
          app.kubernetes.io/name: sfc-redis
          app.kubernetes.io/part-of: sfc
          app.kubernetes.io/instance: production
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: sfc-redis-storage-class
        resources:
          requests:
            storage: 1Gi
        volumeMode: Filesystem