apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sfc-mssql-job-network-policy
  namespace: sfc
  labels:
    app.kubernetes.io/name: sfc-mssql
    app.kubernetes.io/component: policy
    app.kubernetes.io/part-of: sfc
    app.kubernetes.io/instance: production
    app.kubernetes.io/managed-by: kubectl
  annotations:
    owner: "krivorukandrey@gmail.com"
    purpose: "Network policy for MS SQL component in SFC application for running initialize job"
spec:
  policyTypes:
    - Ingress
    - Egress
  podSelector: 
    matchLabels:
      app.kubernetes.io/name: sfc-mssql
      app.kubernetes.io/component: job
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: sfc
          podSelector:
            matchLabels:
              app.kubernetes.io/name: sfc-mssql
      ports:
        - protocol: TCP
          port: 1433