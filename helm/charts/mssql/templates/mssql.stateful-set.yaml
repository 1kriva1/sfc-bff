apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sfc-mssql-stateful-set
  namespace: sfc
  labels:
    app.kubernetes.io/name: sfc-mssql
    app.kubernetes.io/component: infrastructure
    app.kubernetes.io/part-of: sfc
    app.kubernetes.io/instance: production
    app.kubernetes.io/version: "2025"
    app.kubernetes.io/managed-by: kubectl
  annotations:
    owner: "krivorukandrey@gmail.com"
    purpose: "Stateful Set for MS SQL component in SFC application"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: sfc-mssql
  replicas: {{ .Values.replicas }}
  serviceName: sfc-mssql
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sfc-mssql
        app.kubernetes.io/component: infrastructure
        app.kubernetes.io/part-of: sfc
        app.kubernetes.io/instance: production
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: sfc-mssql-init-permissions
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              chown -R 10001:0 /var/opt/mssql && chmod -R g+rwX /var/opt/mssql
          volumeMounts:
            - name: sfc-mssql-volume
              mountPath: /var/opt/mssql          
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
      containers:
        - name: sfc-mssql
          image: mcr.microsoft.com/mssql/server:2025-latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: sfc-mssql-port
              protocol: TCP
              containerPort: 1433
          env:
           - name: ACCEPT_EULA
             valueFrom:
              configMapKeyRef:
               name: sfc-mssql-config-map
               key: ACCEPT_EULA
           - name: MSSQL_AGENT_ENABLED
             valueFrom:
              configMapKeyRef:
               name: sfc-mssql-config-map
               key: MSSQL_AGENT_ENABLED
           - name: SA_PASSWORD
             valueFrom:
              secretKeyRef:
               name: sfc-mssql-secret
               key: SA_PASSWORD
          volumeMounts:
            - name: sfc-mssql-volume
              mountPath: /var/opt/mssql          
          startupProbe:
            tcpSocket:
              port: 1433
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 120          
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - >                  
                  /opt/mssql-tools18/bin/sqlcmd
                  -S 127.0.0.1,1433
                  -U sa
                  -P "$SA_PASSWORD"
                  -No
                  -Q "SELECT 1"
                  -b
                  >/dev/null
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 6          
          livenessProbe:
            tcpSocket:
              port: 1433
            initialDelaySeconds: 120
            periodSeconds: 20
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 6          
          resources:
            requests:
              cpu: "500m"
              memory: "2Gi"
            limits:
              cpu: "1"
              memory: "3Gi"
  volumeClaimTemplates:
    - metadata:
        name: sfc-mssql-volume
        labels:
          app.kubernetes.io/name: sfc-mssql
          app.kubernetes.io/part-of: sfc
          app.kubernetes.io/instance: production
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: sfc-mssql-storage-class
        resources:
          requests:
            storage: 20Gi
        volumeMode: Filesystem