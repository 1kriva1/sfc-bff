apiVersion: v1
kind: Service
metadata:
  name: sfc-rabbitmq
  namespace: sfc
  labels:
    app.kubernetes.io/name: sfc-rabbitmq
    app.kubernetes.io/component: network
    app.kubernetes.io/part-of: sfc
    app.kubernetes.io/instance: production
    app.kubernetes.io/managed-by: kubectl
  annotations:
    owner: "krivorukandrey@gmail.com"
    purpose: "Internal ClusterIP service for Rabbit MQ component in SFC application"
spec:
  selector:
    app.kubernetes.io/name: sfc-rabbitmq
  type: ClusterIP
  ports:
    - name: sfc-rabbitmq-cluster-service-port
      protocol: TCP
      port: 5672
      targetPort: 5672
  internalTrafficPolicy: Cluster