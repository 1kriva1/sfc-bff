apiVersion: v1
kind: Secret
metadata:
  name: sfc-rabbitmq-secret
  namespace: sfc
  labels:
    app.kubernetes.io/name: sfc-rabbitmq
    app.kubernetes.io/component: secret
    app.kubernetes.io/part-of: sfc
    app.kubernetes.io/instance: production
    app.kubernetes.io/managed-by: kubectl
  annotations:
    owner: "krivorukandrey@gmail.com"
