<div class="container" [ngStyle]="{'background': model.background}">
    <div class="content">
        <fa-icon [ngStyle]="{'background': model.iconBackground}" [icon]="model.icon"></fa-icon>
        <div class="info">
            <p>
                <span class="value">{{model.value}} </span>
                <span class="description">{{model.description}}</span>
            </p>
            <h3>{{model.title}}</h3>
        </div>
    </div>    
</div>
