<div class="container">
    <div class="content">
        <sfc-avatar *ngIf="avatar" [radius]="radius" [stroke]="stroke" [stars]="false" [progress]="rating"
            [data]="avatarModel" [progressModel]="avatarProgressModel" [badges]="avatarBadges">
        </sfc-avatar>

        <div *ngIf="info" class="info">
            <h3>{{model.name}}</h3>
            <p>{{model.description}}</p>
            <span>{{model.label}}</span>
            <sfc-stars [value]="stars" [sfcComponentSize] [customSize]="0.7"></sfc-stars>
        </div>
    </div>
</div>
