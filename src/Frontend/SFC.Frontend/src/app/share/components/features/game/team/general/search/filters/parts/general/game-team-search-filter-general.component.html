<div class="container" [formGroupName]="GameTeamFilterPart.General">
    <div class="content">
        <div class="rows">
            <div class="row">
                <div class="column">
                    <sfc-text-input id="city" formControlName="city" [label]="Localization.INPUT.CITY.LABEL"
                        [placeholder]="Localization.INPUT.CITY.PLACEHOLDER" [bordered]="true"
                        [helperText]="Localization.INPUT.CITY.HELPER_TEXT" [validations]="{
                            maxlength: ValidationLocalization.MAX_LENGTH
                          }">
                    </sfc-text-input>
                </div>
            </div>

            <div class="row">
                <div class="column">
                    <sfc-tags-input id="tags" formControlName="tags" [label]="Localization.INPUT.TAGS.LABEL"
                        [placeholder]="Localization.INPUT.TAGS.PLACEHOLDER"
                        [helperText]="Localization.INPUT.TAGS.HELPER_TEXT" [bordered]="true"
                        [maxTagLength]="ValidationConstants.MAX_TAG_VALUE_LENGTH"
                        [newTagPlaceholder]="InputLocalization.ADD_TAG" [validations]="{
                            'sfc-empty':ValidationLocalization.EMPTY, 
                            'sfc-duplicate': ValidationLocalization.DUPLICATE, 
                            'sfc-tags-length': ValidationLocalization.TAG_LENGTH, 
                            'sfc-max-array-length': ValidationLocalization.TAGS_LENGTH
                          }">
                    </sfc-tags-input>
                </div>
            </div>

            <ng-container formGroupName="availability">
                <div class="row">
                    <div class="column">
                        <sfc-bubbles-input id="available-days" formControlName="days" [items]="weekDays"
                            [label]="Localization.INPUT.AVAILABLE_DAYS.LABEL"
                            [helperText]="Localization.INPUT.AVAILABLE_DAYS.HELPER_TEXT">
                        </sfc-bubbles-input>
                    </div>
                </div>

                <div class="row">
                    <div class="column">
                        <sfc-datetime-input id="from-time" formControlName="from" [time]="true" [date]="false"
                            [label]="Localization.INPUT.AVAILABLE_FROM.LABEL"
                            [placeholder]="Localization.INPUT.AVAILABLE_FROM.PLACEHOLDER"
                            [helperText]="Localization.INPUT.AVAILABLE_FROM.HELPER_TEXT" [switchOnClick]="true"
                            [fullSize]="true" [bordered]="true" [hideOnClickOutside]="true" [clearButton]="true"
                            [locale]="locale" [modalButtonsModel]="Constants.DATE_INPUT_MODAL_BUTTONS_MODEL"
                            [validations]="{'sfc-compare-than': ValidationLocalization.FROM_LESS_TO}">
                        </sfc-datetime-input>
                    </div>
                </div>

                <div class="row">
                    <div class="column">
                        <sfc-datetime-input id="to-time" formControlName="to" [time]="true" [date]="false"
                            [label]="Localization.INPUT.AVAILABLE_TO.LABEL"
                            [placeholder]="Localization.INPUT.AVAILABLE_TO.PLACEHOLDER"
                            [helperText]="Localization.INPUT.AVAILABLE_TO.HELPER_TEXT" [switchOnClick]="true"
                            [fullSize]="true" [bordered]="true" [hideOnClickOutside]="true" [clearButton]="true"
                            [locale]="locale" [modalButtonsModel]="Constants.DATE_INPUT_MODAL_BUTTONS_MODEL"
                            [validations]="{'sfc-compare-than': ValidationLocalization.TO_MORE_FROM}">
                        </sfc-datetime-input>
                    </div>
                </div>
            </ng-container>

            <div class="row">
                <div class="column">
                    <sfc-radio-input id="has-logo" formControlName="hasLogo" [items]="Constants.HAS_LOGO_RADIO_ITEMS"
                        [direction]="Direction.Horizontal" [label]="Localization.INPUT.HAS_LOGO.LABEL"
                        [helperText]="Localization.INPUT.HAS_LOGO.HELPER_TEXT">
                    </sfc-radio-input>
                </div>
            </div>
        </div>
    </div>
</div>
