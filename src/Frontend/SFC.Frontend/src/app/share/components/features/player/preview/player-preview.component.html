<div class="container">
    <sfc-title [label]="Localization.TITLE.LABEL" [description]="Localization.TITLE.DESCRIPTION"></sfc-title>

    <div class="content">
        <div *ngIf="model" class="player">
            <sfc-player-info [info]="true" [avatar]="false" [model]="{
                            firstName: model.firstName,
                            lastName: model.lastName,
                            city:model.city,
                            age: model.age               
                        }" [sfcComponentSize] [customSize]="1.3"></sfc-player-info>

            <sfc-enum *ngIf="model.position" [enum]="model.position"></sfc-enum>

            <sfc-tags [tags]="model.tags" [sfcComponentSize] [customSize]="0.7"></sfc-tags>

            <sfc-stats-skills [values]="[model.stats]" [sfcComponentSize] [customSize]="0.5"></sfc-stats-skills>
        </div>

        <sfc-no-data *ngIf="!model" [textContent]="Localization.NO_DATA_LABEL"></sfc-no-data>
    </div>
</div>
