<div class="container">
    <div class="content">
        <form [formGroup]="form" autocomplete="off">
            <div class="parts">
                <div class="part top">
                    <div class="part-content">
                        <div class="title">
                            <sfc-title [label]="Localization.TITLE.LABEL" [description]="Localization.TITLE.DESCRIPTION"
                                [tooltip]="Localization.TITLE.TOOLTIP" [icon]="faQuestionCircle" [sfcComponentSize]
                                [customSize]="1.2">
                            </sfc-title>
                        </div>

                        <div class="main">
                            <div class="menu">
                                <sfc-side-menu [model]="menu"></sfc-side-menu>
                            </div>

                            <div class="preview">
                                <sfc-scheme-game-team-edit-main *ngIf="changesCheckService.changes$ | async as changes"
                                    [submitDisabled]="!changes.dirty" [submitButtonText]="'Update Scheme Game Team'"
                                    [buildSubmitObservable]="update" (postSubmit)="onUpdated($event)">
                                </sfc-scheme-game-team-edit-main>
                            </div>
                        </div>


                    </div>
                </div>

                <div class="part bottom">
                    <div class="part-content">
                        <div class="routes">
                            <router-outlet></router-outlet>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>

    <!-- changes check modal -->
    <sfc-changes-check-modal [label]="Localization.CHANGES_MODAL_LABEL"></sfc-changes-check-modal>
</div>
