<div class="container" [formGroupName]="GameTeamProfileEditPart.General">
    <sfc-title [label]="'Localization.TITLE.LABEL'" [description]="'Localization.TITLE.DESCRIPTION'"
        [icon]="faQuestionCircle" [tooltip]="Localization.TITLE.TOOLTIP" [sfcComponentSize] [customSize]="1"
        [delimeter]="true">
    </sfc-title>

    <div class="content">
        <div class="parts">
            <div class="part inputs">
                <div class="rows">
                    <div class="row logo">
                        <div class="columns">
                            <div class="column logo">
                                <sfc-image-input id="logo" formControlName="logo"
                                    [label]="Localization.INPUT.LOGO.LABEL"
                                    [helperText]="Localization.INPUT.LOGO.HELPER_TEXT" [icon]="faCamera"
                                    [clearButton]="true" [hideOnClickOutside]="true"
                                    [defaultPhoto]="CoreConstants.DEFAULT_TEAM_A_IMAGE_PATH"
                                    [okLabel]="CoreLocalization.OK" [cancelLabel]="CoreLocalization.CANCEL"
                                    [validations]="{
                                        'sfc-format': ValidationLocalization.FILE_FORMAT,
                                        'sfc-file-max-size': logoMaxSizeValidationMessage
                                    }">
                                </sfc-image-input>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="columns">
                            <div class="column name">
                                <sfc-text-input id="name" formControlName="name" [label]="Localization.INPUT.NAME.LABEL"
                                    [placeholder]="Localization.INPUT.NAME.PLACEHOLDER"
                                    [helperText]="Localization.INPUT.NAME.HELPER_TEXT" [bordered]="true" [validations]="{
                                                    'required': ValidationLocalization.REQUIRED,
                                                    'maxlength': ValidationLocalization.MAX_LENGTH
                                                }">
                                </sfc-text-input>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="columns">
                            <div class="column description">
                                <sfc-text-area-input id="description" formControlName="description" [bordered]="true"
                                    [label]="Localization.INPUT.DESCRIPTION.LABEL"
                                    [placeholder]="Localization.INPUT.DESCRIPTION.PLACEHOLDER"
                                    [helperText]="Localization.INPUT.DESCRIPTION.HELPER_TEXT" [validations]="{
                                                    'maxlength': ValidationLocalization.MAX_LENGTH
                                                }">
                                </sfc-text-area-input>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="columns">
                            <div class="column tags">
                                <sfc-tags-input id="tags" formControlName="tags" [label]="Localization.INPUT.TAGS.LABEL"
                                    [placeholder]="Localization.INPUT.TAGS.PLACEHOLDER"
                                    [helperText]="Localization.INPUT.TAGS.HELPER_TEXT" [bordered]="true"
                                    [newTagPlaceholder]="InputsLocalization.ADD_TAG"
                                    [maxTagLength]="ValidationConstants.MAX_TAG_VALUE_LENGTH" [validations]="{
                                                'sfc-empty': ValidationLocalization.EMPTY,
                                                'sfc-duplicate': ValidationLocalization.DUPLICATE,
                                                'sfc-tags-length': tagMaxLengthValidationMessage(ValidationConstants.MAX_TAG_VALUE_LENGTH),
                                                'sfc-max-array-length': ValidationLocalization.TAGS_LENGTH
                                            }">
                                </sfc-tags-input>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="part delimeter">
                <sfc-delimeter></sfc-delimeter>
            </div>

            <div class="part actions" *ngIf="!model?.gameTeam">
                <sfc-form-progress-actions [key]="Constants.ProgressKey" [form]="generalForm">
                </sfc-form-progress-actions>
            </div>
        </div>

    </div>
</div>
