<div class="container" [formGroupName]="GameEditPart.Teams">
    <sfc-title [label]="Localization.TITLE.LABEL" [description]="Localization.TITLE.DESCRIPTION"
        [icon]="faQuestionCircle" [tooltip]="Localization.TITLE.TOOLTIP" [sfcComponentSize] [customSize]="1"
        [delimeter]="true">
    </sfc-title>

    <div class="content">
        <div class="parts">
            <div class="part progress">
                <sfc-game-edit-progress [value$]="value$"></sfc-game-edit-progress>
            </div>

            <div class="part tip">
                <p>{{Localization.TIP}}</p>
            </div>

            <div class="part delimeter">
                <sfc-delimeter></sfc-delimeter>
            </div>

            <div class="part actions">
                <sfc-form-progress-actions [key]="Constants.PROGRESS_KEY" [form]="form">
                </sfc-form-progress-actions>
            </div>
        </div>
    </div>
</div>
