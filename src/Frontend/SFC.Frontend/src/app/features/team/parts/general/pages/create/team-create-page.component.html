<div class="container">
    <div class="content">
        <div class="title">
            <sfc-title [label]="Localization.TITLE.LABEL" [description]="Localization.TITLE.DESCRIPTION"
                [tooltip]="Localization.TITLE.TOOLTIP" [icon]="faQuestionCircle" [sfcComponentSize] [customSize]="1.5">
            </sfc-title>
        </div>

        <form [formGroup]="form" autocomplete="off">
            <div class="parts">
                <div class="part left">
                    <sfc-side-menu [model]="menu"></sfc-side-menu>

                    <div class="sub-part">
                        <sfc-team-main-edit [submitButtonText]="CoreLocalization.CREATE"
                            [buildSubmitObservable]="create" (postSubmit)="onCreated($event)"></sfc-team-main-edit>
                        <sfc-team-information-progress [value$]="value$"></sfc-team-information-progress>
                    </div>

                </div>

                <div class="part center">
                    <router-outlet></router-outlet>
                </div>

                <div class="part right">
                    <sfc-team-players-preview [title]="Localization.PREVIEW.TITLE"
                        [description]="Localization.PREVIEW.DESCRIPTION" [players$]="previewPlayers$">
                    </sfc-team-players-preview>
                </div>
            </div>
        </form>
    </div>

    <!-- Cancel player invite -->
    <sfc-exclamation-modal [id]="InviteTeamPlayerModal.Cancel" [text]="Localization.MODAL.CANCEL_INVITE.TEXT"
        [title]="Localization.MODAL.CANCEL_INVITE.TITLE" [applyLabel]="Localization.MODAL.CANCEL_INVITE.BUTTON.APPLY"
        (apply)="onCancelInvite($event)">
    </sfc-exclamation-modal>
</div>
