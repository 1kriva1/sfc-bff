services:
  sfc-mssql:
    container_name: sfc-mssql
    image: mcr.microsoft.com/mssql/server:2025-latest
    env_file:
      - environments/mssql/mssql.${ASPNETCORE_ENVIRONMENT}.env      
    ports:
      - "1433:1433"
    entrypoint: ["/bin/bash", "/usr/src/app/entrypoint.mssql.sh"]
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "127.0.0.1", "-U", "sa", "-P", "Test1234!", "-No", "-Q", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - type: volume
        source: sfc-mssql-volume
        target: /var/opt/mssql
      - type: bind
        source: scripts/mssql
        target: /usr/src/app
    networks:
      - sfc-network
  sfc-redis:
    container_name: sfc-redis
    image: docker.io/redis:8.4.0
    env_file:
      - environments/redis/redis.${ASPNETCORE_ENVIRONMENT}.env
    ports:
      - "6379:6379"
    command: redis-server /usr/local/etc/redis/redis.conf --aclfile /usr/local/etc/redis/users.acl
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    volumes:
      - type: volume
        source: sfc-redis-volume
        target: /data
      - type: bind
        source: ../../Configurations/redis/users.acl
        target: /usr/local/etc/redis/users.acl
      - type: bind
        source: ../../Configurations/redis/redis.conf
        target: /usr/local/etc/redis/redis.conf
    networks:
      - sfc-network
  sfc-rabbitmq:
    container_name: sfc-rabbitmq
    image: docker.io/rabbitmq:4-management
    env_file:
      - environments/rabbitmq/rabbitmq.${ASPNETCORE_ENVIRONMENT}.env
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmqctl", "node_health_check"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    volumes:
      - type: volume
        source: sfc-rabbitmq-volume
        target: /var/lib/rabbitmq
      - type: bind
        source: ../../Configurations/redis/rabbitmq.conf
        target: /etc/rabbitmq/rabbitmq.conf
    networks:
      - sfc-network  
  sfc-nginx:
    container_name: sfc-nginx
    image: nginx:1.25-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ../../Configurations/certificates:/etc/nginx/ssl:ro    
    networks:
      sfc-network:     
        aliases:
          - sfc-identity
    depends_on:
      sfc-mssql:
        condition: service_healthy
        restart: true
      sfc-redis:
        condition: service_healthy
        restart: true
      sfc-rabbitmq:
        condition: service_healthy
        restart: true
      sfc-data:
        condition: service_healthy
        restart: true
      sfc-identity:
        condition: service_healthy
        restart: true
      sfc-player:
        condition: service_healthy
        restart: true
      sfc-team:
        condition: service_healthy
        restart: true
      sfc-invite:
        condition: service_healthy
        restart: true
      sfc-request:
        condition: service_healthy
        restart: true
      sfc-scheme:
        condition: service_healthy
        restart: true
      sfc-game:
        condition: service_healthy
        restart: true
      sfc-bff:
        condition: service_healthy
        restart: true
volumes:
  sfc-mssql-volume:
    name: sfc-mssql-volume
  sfc-redis-volume:
    name: sfc-redis-volume
  sfc-rabbitmq-volume:
    name: sfc-rabbitmq-volume
networks:
  sfc-network:
    name: sfc-network  
    driver: bridge