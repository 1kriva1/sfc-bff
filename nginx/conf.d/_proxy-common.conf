# === Common upstream proxy settings for all services ===

# HTTP/1.1 keeps-alive & WS
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        "upgrade";

# Timeouts suited for Kestrel
proxy_connect_timeout 5s;
proxy_send_timeout    60s;
proxy_read_timeout    60s;

# Send SNI to the backend (Kestrel often selects cert by SNI)
proxy_ssl_server_name on;

# ---------- TRUST MODEL (choose one) ----------
# A) Recommended (production): verify upstream TLS using your internal CA
# proxy_ssl_trusted_certificate /etc/nginx/ssl/ca/SFCRootCA.pem;
# proxy_ssl_verify on;
# proxy_ssl_verify_depth 2;

# B) Dev-only: skip verification for self-signed/internal-CA upstreams
proxy_ssl_verify off;