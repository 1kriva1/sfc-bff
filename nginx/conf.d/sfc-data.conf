server {
    listen 443 ssl http2;
    server_name sfc-data;

    ssl_certificate     /etc/nginx/ssl/sfc-data/sfc-data.crt;
    ssl_certificate_key /etc/nginx/ssl/sfc-data/sfc-data.key;

    # (Optional) Strict-Transport-Security for public sites:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # (Optional) Per-vhost logs (nice when debugging)
    # access_log /var/log/nginx/sfc-data.access.log main;
    # error_log  /var/log/nginx/sfc-data.error.log  warn;

    include /etc/nginx/conf.d/_proxy-common.conf;

    location / {
        proxy_pass https://sfc_data_up;

        # If the upstream cert CN/SAN is not literally "sfc-data", set SNI name explicitly:
        # proxy_ssl_name sfc-data.internal.example;
    }
}