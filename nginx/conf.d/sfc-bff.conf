server {
    listen 443 ssl http2;
    server_name sfc-bff;

    ssl_certificate     /etc/nginx/ssl/sfc-bff/sfc-bff.crt;
    ssl_certificate_key /etc/nginx/ssl/sfc-bff/sfc-bff.key;

    include /etc/nginx/conf.d/_proxy-common.conf;

    # Larger buffers for big response headers/bodies typical in BFFs
    proxy_buffer_size           128k;
    proxy_buffers               8 128k;
    proxy_busy_buffers_size     256k;
    proxy_temp_file_write_size  256k;
    proxy_buffering on;

    # (Optional) Larger uploads here only
    # client_max_body_size 100m;

    location / {
        proxy_pass https://sfc_bff_up;
        # proxy_ssl_name sfc-bff.internal.example;
    }
}