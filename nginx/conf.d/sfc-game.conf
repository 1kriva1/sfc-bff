server {
    listen 443 ssl http2;
    server_name sfc-game;

    ssl_certificate     /etc/nginx/ssl/sfc-game/sfc-game.crt;
    ssl_certificate_key /etc/nginx/ssl/sfc-game/sfc-game.key;

    include /etc/nginx/conf.d/_proxy-common.conf;

    location / {
        proxy_pass https://sfc_game_up;
        # proxy_ssl_name sfc-game.internal.example;
    }
}