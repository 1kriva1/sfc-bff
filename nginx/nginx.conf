user  nginx;
worker_processes auto;

events {
    worker_connections  10240;
    # multi_accept on;
}

http {
    # Basic, battle‑tested defaults
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # If you serve large payloads, tune this per‑service too
    client_max_body_size 50m;

    # Logs: one global format; per‑vhost files defined in each server{}
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct=$upstream_connect_time '
                    'uht=$upstream_header_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # TLS defaults (edge TLS; per‑vhost provides certs)
    ssl_session_cache shared:SSL:20m;
    ssl_session_timeout 10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Gzip (safe defaults)
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml+rss application/xml text/xml image/svg+xml;

    # (Optional) If upstream DNS names change at runtime (Kubernetes/consul), set resolver:
    # resolver 127.0.0.11 valid=30s ipv6=off;  # Docker default DNS
    # resolver_timeout 5s;

    include /etc/nginx/conf.d/*.conf;
}