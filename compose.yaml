name: sfc-bff
include:
   - compose.Infrastructure.yaml
x-build-args: &build_args
  args:
    BUILD_CONFIGURATION: Release
services:
  sfc-bff:
    extends:
      file: compose.Common.yaml
      service: sfc-bff  
    image: kryvorukandrii/sfc.bff:latest
    build:
      dockerfile: src/Backend/SFC.Backend/Dockerfile
      <<: *build_args
    env_file:
      - environments/api/api.Production.env
  sfc-data:
    extends:
      file: compose.Common.yaml
      service: sfc-data  
    image: kryvorukandrii/sfc.data:latest
    build:
      dockerfile: ../../Services/sfc-data-service/src/API/SFC.Data.Api/Dockerfile
      <<: *build_args
    env_file:
      - ../../Services/sfc-data-service/environments/api/api.Production.env
  sfc-identity:
    extends:
      file: compose.Common.yaml
      service: sfc-identity  
    image: kryvorukandrii/sfc.identity:latest
    build:
      dockerfile: ../../Services/sfc-identity-service/src/API/SFC.Identity.Api/Dockerfile
      <<: *build_args
    env_file:
      - ../../Services/sfc-identity-service/environments/api/api.Production.env
  sfc-player:
    extends:
      file: compose.Common.yaml
      service: sfc-player  
    image: kryvorukandrii/sfc.player:latest
    build:
      dockerfile: ../../Services/sfc-player-service/src/API/SFC.Player.Api/Dockerfile
      <<: *build_args
    env_file:
      - ../../Services/sfc-player-service/environments/api/api.Production.env
  sfc-team:
    extends:
      file: compose.Common.yaml
      service: sfc-team  
    image: kryvorukandrii/sfc.team:latest
    build:
      dockerfile: ../../Services/sfc-team-service/src/API/SFC.Team.Api/Dockerfile
      <<: *build_args
    env_file:
      - ../../Services/sfc-team-service/environments/api/api.Production.env
  sfc-invite:
    extends:
      file: compose.Common.yaml
      service: sfc-invite  
    image: kryvorukandrii/sfc.invite:latest
    build:
      dockerfile: ../../Services/sfc-invite-service/src/API/SFC.Invite.Api/Dockerfile
      <<: *build_args
    env_file:
      - ../../Services/sfc-invite-service/environments/api/api.Production.env
  sfc-request:
    extends:
      file: compose.Common.yaml
      service: sfc-request  
    image: kryvorukandrii/sfc.request:latest
    build:
      dockerfile: ../../Services/sfc-request-service/src/API/SFC.Request.Api/Dockerfile
      <<: *build_args
    env_file:
      - ../../Services/sfc-request-service/environments/api/api.Production.env
  sfc-scheme:
    extends:
      file: compose.Common.yaml
      service: sfc-scheme  
    image: kryvorukandrii/sfc.scheme:latest
    build:
      dockerfile: ../../Services/sfc-scheme-service/src/API/SFC.Scheme.Api/Dockerfile
      <<: *build_args
    env_file:
      - ../../Services/sfc-scheme-service/environments/api/api.Production.env