name: sfc-bff
include:
   - compose.Infrastructure.yaml
x-build-args: &build_args
  args:
    BUILD_CONFIGURATION: Release
x-entrypoint-common-volume: &entrypoint_common_volume
  type: bind
  source: ${PWD}/entrypoint.Common.sh
  target: /app/entrypoint.Common.sh
x-entrypoint-volume: &entrypoint_volume
  type: bind
  source: ${PWD}/entrypoint.sh
  target: /app/entrypoint.sh
services:
  sfc-bff:
    extends:
      file: compose.Common.yaml
      service: sfc-bff  
    image: kryvorukandrii/sfc.bff:latest
    build:
      dockerfile: src/Backend/SFC.Backend/Dockerfile
      <<: *build_args
    entrypoint: ["/bin/sh", "entrypoint.sh"]
    command: ["SFC.Backend"]
    env_file:
      - environments/api/api.Production.env
    volumes:
      - *entrypoint_common_volume
      - *entrypoint_volume
  sfc-data:
    extends:
      file: compose.Common.yaml
      service: sfc-data  
    image: kryvorukandrii/sfc.data:latest
    build:
      dockerfile: ../../Services/sfc-data-service/src/API/SFC.Data.Api/Dockerfile
      <<: *build_args
    entrypoint: ["/bin/sh", "entrypoint.sh"]
    command: ["SFC.Data.Api"]
    env_file:
      - ../../Services/sfc-data-service/environments/api/api.Production.env
    volumes:
      - *entrypoint_common_volume
      - *entrypoint_volume
  sfc-identity:
